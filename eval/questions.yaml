#   so the model never sees the answer. Add `question:` to override the wording.
# - Entries with `id:` are new questions with their own gold SQL.
# - `exclude:` holds out additional few-shot examples that are near-duplicates of the answer.
# Run `python -m eval.check_gold` after editing: every gold query must run and return rows.

questions:
